<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whistle-lab</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#ddd; --mut:#888; --acc:#3a7; --bad:#c44; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--fg);
         font: 15px/1.4 system-ui, sans-serif; max-width: 900px; margin-inline:auto; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  label { color:var(--mut); font-size:13px; }
  input[type=text], input[type=number] { background:#222; color:var(--fg); border:1px solid #333;
         border-radius:6px; padding:8px; font-size:15px; }
  input[type=text] { flex:1; min-width:120px; }
  input[type=number] { width:80px; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid #444; border-radius:8px;
           padding:10px 14px; font-size:15px; }
  button:disabled { opacity:.4; }
  #rec { width:100%; padding:18px; font-size:20px; background:var(--acc); border:none; color:#fff; }
  #rec.on { background:var(--bad); }
  canvas { width:100%; background:#000; border-radius:6px; display:block; }
  #status { color:var(--mut); font-size:13px; min-height:1.4em; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:6px 4px; border-bottom:1px solid #222; }
  tr.sel td { background:#1d2a22; }
  td.x { text-align:right; white-space:nowrap; }
  td button { padding:4px 8px; font-size:13px; }
</style>
</head>
<body>
<h1>whistle-lab <a href="detect.html" style="font-size:14px;color:var(--acc);margin-left:10px">detector →</a></h1>

<div class="row">
  <label for="dataset">dataset</label><input id="dataset" type="text" value="default">
</div>
<div class="row">
  <label for="label">label</label><input id="label" type="text" placeholder="e.g. high-low-high">
</div>

<button id="rec">● Record</button>
<div id="status"></div>

<canvas id="spec" height="320"></canvas>

<div class="row" style="margin-top:8px">
  <label>f max (Hz)</label><input id="fmax" type="number" value="6000" step="500">
  <label>range (dB)</label><input id="range" type="number" value="70" step="5">
  <label>NFFT</label><input id="nfft" type="number" value="1024" step="256">
  <label><input id="peak" type="checkbox"> peak track</label>
</div>

<div class="row">
  <audio id="player" controls style="flex:1; min-width:200px"></audio>
</div>
<div class="row">
  <input id="notes" type="text" placeholder="notes (optional)">
  <button id="save" disabled>Save</button>
  <button id="discard" disabled>Discard</button>
</div>

<h1 style="margin-top:18px">Recordings <span id="count" style="color:var(--mut)"></span></h1>
<table id="list"></table>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
