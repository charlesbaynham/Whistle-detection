; M5Stack ATOM Echo (ESP32-PICO-D4, 4 MB flash, no PSRAM). Pin map in README.md.
;
; First flash over USB:   pio run -e atom-echo -t upload
; Afterwards over Wi-Fi:  pio run -e atom-echo-ota -t upload
; Both need secrets.ini (copy secrets.ini.example); it is gitignored.

[platformio]
default_envs = atom-echo
extra_configs = secrets.ini

[secrets]
; Defaults so the project builds without secrets.ini (e.g. in CI); real values override these.
wifi_ssid =
wifi_password =
ota_password = changeme
hostname = whistle-echo
; host:port of a whistle-lab server for trigger uploads and heartbeats; empty = none.
debug_server =

[env]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
; min_spiffs: two 1.9 MB app slots, needed for OTA headroom.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:git_rev.py
; lib_deps: add an MQTT client here when the HA link is built (e.g. knolleary/PubSubClient).
build_flags =
  -Wall
  '-DWIFI_SSID="${secrets.wifi_ssid}"'
  '-DWIFI_PASSWORD="${secrets.wifi_password}"'
  '-DOTA_PASSWORD="${secrets.ota_password}"'
  '-DHOSTNAME="${secrets.hostname}"'
  '-DDEBUG_SERVER="${secrets.debug_server}"'

[env:atom-echo]
; The PICO-D4's USB-serial bridge is unreliable above 750 kbaud.
upload_speed = 750000

[env:atom-echo-ota]
upload_protocol = espota
upload_port = ${secrets.hostname}.local
upload_flags = --auth=${secrets.ota_password}
